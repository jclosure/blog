<script>
  document.addEventListener("DOMContentLoaded", function () {
    var canvas = document.getElementById("hero-geometry");
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext("2d");

    // Regular n-simplex: reduce the (n+1) standard basis vectors of R^(n+1),
    // mean-centered, onto an orthonormal basis of the n-dim subspace they span.
    function simplexVertices(n) {
      var m = n + 1;
      var pts = [];
      for (var i = 0; i < m; i++) {
        var v = [];
        for (var k = 0; k < m; k++) v.push(k === i ? 1 - 1 / m : -1 / m);
        pts.push(v);
      }
      var basis = [];
      for (var i = 1; i < m; i++) {
        var v = pts[i].map(function (x, k) { return x - pts[0][k]; });
        for (var b = 0; b < basis.length; b++) {
          var dot = 0;
          for (var k = 0; k < v.length; k++) dot += v[k] * basis[b][k];
          v = v.map(function (x, k) { return x - dot * basis[b][k]; });
        }
        var norm = Math.sqrt(v.reduce(function (s, x) { return s + x * x; }, 0));
        v = v.map(function (x) { return x / norm; });
        basis.push(v);
      }
      return pts.map(function (p) {
        return basis.map(function (b) {
          return p.reduce(function (s, x, k) { return s + x * b[k]; }, 0);
        });
      });
    }

    // The 4-cube: 16 vertices at every combination of (+-r, +-r, +-r, +-r),
    // edges wherever two vertices differ in exactly one coordinate.
    function tesseractVertices(r) {
      var pts = [];
      for (var i = 0; i < 16; i++) {
        var v = [];
        for (var k = 0; k < 4; k++) v.push(((i >> k) & 1) ? r : -r);
        pts.push(v);
      }
      var edges = [];
      for (var a = 0; a < pts.length; a++) {
        for (var b = a + 1; b < pts.length; b++) {
          var diff = 0;
          for (var k = 0; k < 4; k++) if (pts[a][k] !== pts[b][k]) diff++;
          if (diff === 1) edges.push([a, b]);
        }
      }
      return { verts: pts, edges: edges };
    }

    function completeEdges(count) {
      var e = [];
      for (var i = 0; i < count; i++) for (var j = i + 1; j < count; j++) e.push([i, j]);
      return e;
    }

    // simplexVertices(3) hands back 3D points (a tetrahedron); pad to 4D
    // with a zero so it can ride through the same 4D rotation pipeline.
    function to4(v) {
      var out = v.slice();
      while (out.length < 4) out.push(0);
      return out;
    }

    var colors = [
      getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#5fd38d",
      getComputedStyle(document.documentElement).getPropertyValue("--accent-2").trim() || "#f2b84b",
      getComputedStyle(document.documentElement).getPropertyValue("--accent-3").trim() || "#64c7d8"
    ];

    var tess = tesseractVertices(0.62);

    // A small constellation of polytopes on one shared clock: each spins in
    // its own pair of 4D planes at its own rate, but the rates are simple
    // multiples of one another, so they keep drifting in and out of step
    // rather than ever looking random. Each also wanders a little from its
    // home point (driftAX/driftAY, as a fraction of width/height), so
    // nothing sits frozen in place -- rotation alone can look like a
    // photograph; a little translation makes it look like company.
    var bodies = [
      { // the 5-cell (regular 4-simplex) -- the anchor shape, biggest and brightest
        verts: simplexVertices(4).map(function (v) { return v.map(function (x) { return x * 1.7; }); }),
        edges: completeEdges(5),
        cx: 0.68, cy: 0.5, scale: 3.4,
        narrowCx: 0.8, narrowCy: 0.15, narrowScale: 1.4,
        freq: 1, phase: 0, dot: 4.4, weight: 2.6, minA: 0.58, maxA: 1,
        driftAX: 0.018, driftFX: 0.00011, driftAY: 0.02, driftFY: 0.00014,
        showNarrow: true
      },
      { // tesseract, tucked up top -- cooler and quieter, its own rhythm
        verts: tess.verts, edges: tess.edges,
        cx: 0.87, cy: 0.18, scale: 1.35,
        freq: 1.5, phase: 1.9, dot: 3, weight: 2, minA: 0.46, maxA: 0.85,
        driftAX: 0.022, driftFX: 0.00016, driftAY: 0.03, driftFY: 0.0001
      },
      { // a tetrahedron (3-simplex) drifting low
        verts: simplexVertices(3).map(function (v) { return to4(v.map(function (x) { return x * 1.3; })); }),
        edges: completeEdges(4),
        cx: 0.84, cy: 0.84, scale: 2.1,
        freq: 0.75, phase: 4.1, dot: 3.6, weight: 2.4, minA: 0.5, maxA: 0.92,
        driftAX: 0.02, driftFX: 0.00009, driftAY: 0.024, driftFY: 0.00013
      },
      { // a triangle (2-simplex) keeping the headline company -- simple
        // enough to still read clearly at a small, quiet size
        verts: simplexVertices(2).map(function (v) { return to4(v.map(function (x) { return x * 1.3; })); }),
        edges: completeEdges(3),
        cx: 0.2, cy: 0.26, scale: 1.15,
        freq: 1.2, phase: 2.6, dot: 3.1, weight: 2.2, minA: 0.46, maxA: 0.8,
        driftAX: 0.026, driftFX: 0.00013, driftAY: 0.03, driftFY: 0.00017,
        noThread: true
      },
      { // a second triangle in the quiet gap left of the buttons --
        // bookends the headline with the one above it
        verts: simplexVertices(2).map(function (v) { return to4(v.map(function (x) { return x * 1.5; })); }),
        edges: completeEdges(3),
        cx: 0.22, cy: 0.6, scale: 1.35,
        freq: 0.9, phase: 3.3, dot: 3.3, weight: 2.3, minA: 0.5, maxA: 0.88,
        driftAX: 0.028, driftFX: 0.0001, driftAY: 0.024, driftFY: 0.00015,
        noThread: true
      }
    ];

    function rotatePlane(v, i, j, angle) {
      var c = Math.cos(angle), s = Math.sin(angle);
      var r = v.slice();
      r[i] = v[i] * c - v[j] * s;
      r[j] = v[i] * s + v[j] * c;
      return r;
    }

    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w, h;

    function resize() {
      var rect = canvas.parentElement.getBoundingClientRect();
      w = rect.width;
      h = rect.height;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    function project(v) {
      var d4 = 3.4;
      var f1 = 1 / (d4 - v[3]);
      var x = v[0] * f1, y = v[1] * f1, z = v[2] * f1;
      var d3 = 3.0;
      var f2 = 1 / (d3 - z);
      return { x: x * f2, y: y * f2, depth: v[3] };
    }

    function drawBody(body, t, narrow, alphaMul, pulse) {
      var a = t * 0.00013 * body.freq + body.phase;
      var b = t * 0.00009 * body.freq + body.phase * 0.5;
      var rotated = body.verts.map(function (v) {
        v = rotatePlane(v, 0, 1, a);
        v = rotatePlane(v, 2, 3, b);
        v = rotatePlane(v, 0, 2, b * 0.6);
        return v;
      });
      var projected = rotated.map(project);

      var scale = Math.min(w, h) * (narrow ? body.narrowScale || body.scale : body.scale);
      var driftX = (body.driftAX || 0) * Math.sin(t * (body.driftFX || 0.0001) + body.phase);
      var driftY = (body.driftAY || 0) * Math.sin(t * (body.driftFY || 0.00013) + body.phase * 1.3 + 1.7);
      var cx = w * ((narrow ? (body.narrowCx != null ? body.narrowCx : body.cx) : body.cx) + (narrow ? driftX * 0.4 : driftX));
      var cy = h * ((narrow ? (body.narrowCy != null ? body.narrowCy : body.cy) : body.cy) + (narrow ? driftY * 0.4 : driftY));

      // Each edge and node gets a dark "outline" pass drawn first, then the
      // bright color on top -- a halo that reads against both the light and
      // dark patches of the photo behind it, not just a plain dark page.
      body.edges.forEach(function (e, idx) {
        var p0 = projected[e[0]], p1 = projected[e[1]];
        var depth = (p0.depth + p1.depth) / 2;
        var alpha = (body.minA + (depth + 1.5) / 3 * (body.maxA - body.minA)) * alphaMul * pulse;
        var a = Math.max(0.05, Math.min(1, alpha));
        var x0 = cx + p0.x * scale, y0 = cy + p0.y * scale;
        var x1 = cx + p1.x * scale, y1 = cy + p1.y * scale;

        ctx.strokeStyle = "rgba(4, 6, 7, 0.75)";
        ctx.globalAlpha = Math.min(1, a + 0.15);
        ctx.lineWidth = body.weight + 2.4;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();

        ctx.strokeStyle = colors[idx % 3];
        ctx.globalAlpha = a;
        ctx.lineWidth = body.weight;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
      });

      projected.forEach(function (p) {
        var alpha = (body.minA + 0.2 + (p.depth + 1.5) / 3 * (body.maxA - body.minA)) * alphaMul * pulse;
        var a = Math.max(0.08, Math.min(1, alpha));
        var px = cx + p.x * scale, py = cy + p.y * scale;

        ctx.globalAlpha = Math.min(1, a + 0.15);
        ctx.fillStyle = "rgba(4, 6, 7, 0.75)";
        ctx.beginPath();
        ctx.arc(px, py, body.dot + 1.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = a;
        ctx.fillStyle = "#f8fbf9";
        ctx.beginPath();
        ctx.arc(px, py, body.dot, 0, Math.PI * 2);
        ctx.fill();
      });

      return { x: cx, y: cy, alpha: alphaMul * pulse };
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      var narrow = w < 640;
      var alphaMul = narrow ? 0.8 : 1;
      // One shared, slow breath -- each body spins on its own, but they
      // all brighten and dim together, like they're listening to the
      // same clock.
      var pulse = 0.78 + Math.sin(t * 0.00028) * 0.22;

      var active = narrow ? bodies.filter(function (body) { return body.showNarrow; }) : bodies;
      var centers = active.map(function (body) { return drawBody(body, t, narrow, alphaMul, pulse); });

      // Faint threads between the bodies, brightening on that same
      // breath -- a quiet suggestion that these shapes are coordinating.
      // The two ghost shapes flanking the copy sit out of this: they're
      // meant to be quiet company for the text, not wired into the rest.
      if (!narrow && centers.length > 1) {
        ctx.setLineDash([2, 6]);
        for (var i = 0; i < centers.length; i++) {
          if (active[i].noThread) continue;
          for (var j = i + 1; j < centers.length; j++) {
            if (active[j].noThread) continue;
            var dx = centers[i].x - centers[j].x, dy = centers[i].y - centers[j].y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            var alpha = 0.55 * pulse - dist / (w * 3.2);
            if (alpha <= 0.02) continue;

            ctx.strokeStyle = "rgba(4, 6, 7, 0.7)";
            ctx.globalAlpha = Math.min(1, alpha + 0.15);
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(centers[i].x, centers[i].y);
            ctx.lineTo(centers[j].x, centers[j].y);
            ctx.stroke();

            ctx.strokeStyle = colors[(i + j) % 3];
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(centers[i].x, centers[i].y);
            ctx.lineTo(centers[j].x, centers[j].y);
            ctx.stroke();
          }
        }
        ctx.setLineDash([]);
      }
      ctx.globalAlpha = 1;
    }

    if (reduceMotion) {
      draw(24000);
    } else {
      requestAnimationFrame(function loop(t) {
        draw(t);
        requestAnimationFrame(loop);
      });
    }
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var canvas = document.getElementById("hero-leaves");
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext("2d");

    // Little torn scraps of paper, each carrying a fragment of what this
    // notebook is actually made of: math, code, and the odd loose thought.
    var symbols = ["{ }", "λ", "Σ", "π", "0", "∞", ";", "01",
      "f(x)", "∴", "Δ", "→", "∀", "≈", "git",
      "0x2A", "n²", "d/dx", "ssh", "AOP"];

    var styles = getComputedStyle(document.documentElement);
    var colors = ["--accent", "--accent-2", "--accent-3"].map(function (v) {
      return styles.getPropertyValue(v).trim();
    });

    function rand(min, max) { return min + Math.random() * (max - min); }

    function makeLeaf() {
      return {
        baseX: rand(0.04, 0.96),
        baseY: rand(-0.2, 1.3),
        vy: rand(0.000018, 0.000048),
        driftAmp: rand(0.02, 0.06),
        driftFreq: rand(0.00015, 0.00035),
        driftPhase: rand(0, Math.PI * 2),
        spin0: rand(-0.35, 0.35),
        spinSpeed: rand(-0.00011, 0.00011),
        size: rand(26, 48),
        symbol: symbols[Math.floor(Math.random() * symbols.length)],
        color: colors[Math.floor(Math.random() * colors.length)],
        depth: rand(0.3, 1)
      };
    }

    var LEAF_COUNT = 13;
    var leaves = [];
    for (var i = 0; i < LEAF_COUNT; i++) leaves.push(makeLeaf());

    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w, h;

    function resize() {
      var rect = canvas.parentElement.getBoundingClientRect();
      w = rect.width;
      h = rect.height;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    function drawLeaf(leaf, t) {
      var narrow = w < 640;
      var span = 1.5;
      var y = (((leaf.baseY + t * leaf.vy) % span) + span) % span - 0.2;
      var x = leaf.baseX + Math.sin(t * leaf.driftFreq + leaf.driftPhase) * leaf.driftAmp;
      var rot = leaf.spin0 + t * leaf.spinSpeed;
      var size = leaf.size * (narrow ? 0.7 : 1);
      var fold = size * 0.26;

      ctx.save();
      ctx.translate(x * w, y * h);
      ctx.rotate(rot);
      ctx.globalAlpha = (narrow ? 0.6 : 1) * (0.16 + leaf.depth * 0.48);

      ctx.beginPath();
      ctx.moveTo(-size / 2, -size * 0.62);
      ctx.lineTo(size / 2 - fold, -size * 0.62);
      ctx.lineTo(size / 2, -size * 0.62 + fold);
      ctx.lineTo(size / 2, size * 0.62);
      ctx.lineTo(-size / 2, size * 0.62);
      ctx.closePath();
      ctx.fillStyle = "rgba(23, 29, 34, 0.4)";
      ctx.fill();
      ctx.strokeStyle = leaf.color;
      ctx.lineWidth = 1.1;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(size / 2 - fold, -size * 0.62);
      ctx.lineTo(size / 2 - fold, -size * 0.62 + fold);
      ctx.lineTo(size / 2, -size * 0.62 + fold);
      ctx.stroke();

      ctx.fillStyle = leaf.color;
      ctx.font = "600 " + Math.round(size * 0.3) + "px 'SFMono-Regular', Menlo, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(leaf.symbol, 0, size * 0.05);

      ctx.restore();
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      leaves.forEach(function (leaf) { drawLeaf(leaf, t); });
      ctx.globalAlpha = 1;
    }

    if (reduceMotion) {
      draw(9000);
    } else {
      requestAnimationFrame(function loop(t) {
        draw(t);
        requestAnimationFrame(loop);
      });
    }
  });
</script>
<style>
  :root {
    --page-bg: #101418;
    --panel-bg: #171d22;
    --panel-border: #35424b;
    --accent: #5fd38d;
    --accent-2: #f2b84b;
    --accent-3: #64c7d8;
    --muted: #9caab4;
    --text: #f2f5f3;
  }

  body {
    background: var(--page-bg);
    color: var(--text);
    line-height: 1.65;
    overflow-x: hidden;
  }

  body:has(.site-hero) > header {
    display: none;
  }

  body:has(.site-hero) #main_content,
  body:has(.site-hero) #main_content h1,
  body:has(.site-hero) #main_content h2,
  body:has(.site-hero) #main_content h3,
  body:has(.site-hero) #main_content strong,
  body:has(.site-hero) .button-link {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    letter-spacing: 0;
    text-shadow: none;
  }

  header h1::after {
    content: ""; /* no content, add a subtitle here */
    display: block;
    color: var(--muted);
    font-size: 0.42em;
    font-weight: 400;
    margin-top: 0.35rem;
  }

  .site-hero {
    min-height: clamp(347px, 38vh, 437px);
    display: grid;
    align-items: stretch;
    position: relative;
    overflow: hidden;
    margin: -1.5rem -1rem 2.5rem;
    padding: clamp(0.9rem, 2vw, 1.5rem) clamp(1rem, 5vw, 4rem) clamp(1rem, 2.5vw, 1.75rem);
    border-bottom: 1px solid var(--panel-border);
    background: #0b0f12;
  }

  .hero-media {
    position: absolute;
    inset: 0;
    background: #0b0f12;
    overflow: hidden;
  }

  .hero-media canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  .hero-photo {
    position: absolute;
    right: clamp(0.5rem, 4vw, 4.5rem);
    bottom: 0;
    height: 88%;
    width: auto;
    max-width: 56%;
    object-fit: contain;
    object-position: bottom;
    filter: drop-shadow(0 18px 26px rgba(2, 4, 5, 0.65)) saturate(0.92);
    opacity: 0.92;
  }

  .hero-media::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(10, 14, 17, 0.88), rgba(10, 14, 17, 0.3) 48%, rgba(10, 14, 17, 0.4));
    pointer-events: none;
  }

  .hero-copy {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    max-width: 620px;
  }

  .hero-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: clamp(0.65rem, 2.5vh, 1.2rem);
  }

  .hero-nav a {
    display: inline-flex;
    align-items: center;
    min-height: 34px;
    padding: 0.35rem 0.7rem;
    border: 1px solid rgba(197, 208, 213, 0.24);
    border-radius: 999px;
    background: rgba(11, 15, 18, 0.44);
    color: #dce6e1;
    font-size: 0.85rem;
    text-decoration: none;
  }

  .hero-nav a:hover {
    border-color: rgba(95, 211, 141, 0.75);
    color: #ffffff;
  }

  .hero-statement {
    max-width: 620px;
  }

  .eyebrow,
  .feature-kicker {
    color: var(--accent-2);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: uppercase;
  }

  .site-hero h1 {
    color: #ffffff;
    font-size: clamp(2.25rem, 5.6vw, 4.25rem);
    font-weight: 750;
    line-height: 0.95;
    margin: 0.1rem 0 0.65rem;
  }

  .lede {
    color: #dce6e1;
    font-size: clamp(1rem, 2vw, 1.25rem);
    line-height: 1.55;
    max-width: 680px;
  }

  .hero-bottom {
    display: grid;
    gap: 0.75rem;
    margin-top: auto;
    padding-top: 1rem;
  }

  .hero-focus {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .hero-focus span {
    padding: 0.25rem 0.55rem;
    border-left: 2px solid var(--accent-3);
    background: rgba(11, 15, 18, 0.48);
    color: #d7e2de;
    font-size: 0.86rem;
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-top: 0;
    padding-top: 0;
  }

  .button-link {
    display: inline-flex;
    align-items: center;
    min-height: 42px;
    padding: 0.55rem 0.9rem;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    background: rgba(20, 25, 29, 0.76);
    color: var(--text);
    text-decoration: none;
    transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
  }

  .button-link:hover {
    border-color: rgba(95, 211, 141, 0.86);
    transform: translateY(-1px);
  }

  .button-link.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #07100b;
    font-weight: 700;
  }

  .post-hero {
    margin: 0.4rem 0 2rem;
  }

  .post-hero img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
  }

  .math-figure {
    margin: 2rem auto;
    text-align: center;
  }

  .math-figure img {
    display: block;
    width: min(100%, 920px);
    height: auto;
    margin: 0 auto;
  }

  .math-figure figcaption {
    margin-top: 0.65rem;
    color: var(--muted);
    font-size: 0.95rem;
    text-align: center;
