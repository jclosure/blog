<script>
  document.addEventListener("DOMContentLoaded", function () {
    var canvas = document.getElementById("hero-geometry");
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext("2d");

    // Regular n-simplex: reduce the (n+1) standard basis vectors of R^(n+1),
    // mean-centered, onto an orthonormal basis of the n-dim subspace they span.
    function simplexVertices(n) {
      var m = n + 1;
      var pts = [];
      for (var i = 0; i < m; i++) {
        var v = [];
        for (var k = 0; k < m; k++) v.push(k === i ? 1 - 1 / m : -1 / m);
        pts.push(v);
      }
      var basis = [];
      for (var i = 1; i < m; i++) {
        var v = pts[i].map(function (x, k) { return x - pts[0][k]; });
        for (var b = 0; b < basis.length; b++) {
          var dot = 0;
          for (var k = 0; k < v.length; k++) dot += v[k] * basis[b][k];
          v = v.map(function (x, k) { return x - dot * basis[b][k]; });
        }
        var norm = Math.sqrt(v.reduce(function (s, x) { return s + x * x; }, 0));
        v = v.map(function (x) { return x / norm; });
        basis.push(v);
      }
      return pts.map(function (p) {
        return basis.map(function (b) {
          return p.reduce(function (s, x, k) { return s + x * b[k]; }, 0);
        });
      });
    }

    var verts4 = simplexVertices(4).map(function (v) { return v.map(function (x) { return x * 1.7; }); });
    var edges = [];
    for (var i = 0; i < verts4.length; i++) {
      for (var j = i + 1; j < verts4.length; j++) edges.push([i, j]);
    }

    var colors = [
      getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#5fd38d",
      getComputedStyle(document.documentElement).getPropertyValue("--accent-2").trim() || "#f2b84b",
      getComputedStyle(document.documentElement).getPropertyValue("--accent-3").trim() || "#64c7d8"
    ];

    function rotatePlane(v, i, j, angle) {
      var c = Math.cos(angle), s = Math.sin(angle);
      var r = v.slice();
      r[i] = v[i] * c - v[j] * s;
      r[j] = v[i] * s + v[j] * c;
      return r;
    }

    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w, h;

    function resize() {
      var rect = canvas.parentElement.getBoundingClientRect();
      w = rect.width;
      h = rect.height;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    function project(v) {
      var d4 = 3.4;
      var f1 = 1 / (d4 - v[3]);
      var x = v[0] * f1, y = v[1] * f1, z = v[2] * f1;
      var d3 = 3.0;
      var f2 = 1 / (d3 - z);
      return { x: x * f2, y: y * f2, depth: v[3] };
    }

    function draw(t) {
      var a = t * 0.00013;
      var b = t * 0.00009;
      var rotated = verts4.map(function (v) {
        v = rotatePlane(v, 0, 1, a);
        v = rotatePlane(v, 2, 3, b);
        v = rotatePlane(v, 0, 2, b * 0.6);
        return v;
      });
      var projected = rotated.map(project);

      ctx.clearRect(0, 0, w, h);
      var narrow = w < 640;
      var scale = Math.min(w, h) * (narrow ? 1.4 : 3.4);
      var cx = narrow ? w * 0.8 : w * 0.68;
      var cy = narrow ? h * 0.15 : h * 0.5;
      var alphaMul = narrow ? 0.8 : 1;

      edges.forEach(function (e, idx) {
        var p0 = projected[e[0]], p1 = projected[e[1]];
        var depth = (p0.depth + p1.depth) / 2;
        var alpha = (0.4 + (depth + 1.5) / 3 * 0.4) * alphaMul;
        ctx.strokeStyle = colors[idx % 3];
        ctx.globalAlpha = Math.max(0.3, Math.min(0.85, alpha));
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(cx + p0.x * scale, cy + p0.y * scale);
        ctx.lineTo(cx + p1.x * scale, cy + p1.y * scale);
        ctx.stroke();
      });

      projected.forEach(function (p) {
        var alpha = (0.55 + (p.depth + 1.5) / 3 * 0.4) * alphaMul;
        ctx.globalAlpha = Math.max(0.4, Math.min(0.95, alpha));
        ctx.fillStyle = "#f2f5f3";
        ctx.beginPath();
        ctx.arc(cx + p.x * scale, cy + p.y * scale, 2.8, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    if (reduceMotion) {
      draw(24000);
    } else {
      requestAnimationFrame(function loop(t) {
        draw(t);
        requestAnimationFrame(loop);
      });
    }
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var canvas = document.getElementById("hero-leaves");
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext("2d");

    // Little torn scraps of paper, each carrying a fragment of what this
    // notebook is actually made of: math, code, and the odd loose thought.
    var symbols = ["{ }", "λ", "Σ", "π", "0", "∞", ";", "01",
      "f(x)", "∴", "Δ", "→", "∀", "≈", "git",
      "0x2A", "n²", "d/dx", "ssh", "AOP"];

    var styles = getComputedStyle(document.documentElement);
    var colors = ["--accent", "--accent-2", "--accent-3"].map(function (v) {
      return styles.getPropertyValue(v).trim();
    });

    function rand(min, max) { return min + Math.random() * (max - min); }

    function makeLeaf() {
      return {
        baseX: rand(0.04, 0.96),
        baseY: rand(-0.2, 1.3),
        vy: rand(0.000018, 0.000048),
        driftAmp: rand(0.02, 0.06),
        driftFreq: rand(0.00015, 0.00035),
        driftPhase: rand(0, Math.PI * 2),
        spin0: rand(-0.35, 0.35),
        spinSpeed: rand(-0.00011, 0.00011),
        size: rand(26, 48),
        symbol: symbols[Math.floor(Math.random() * symbols.length)],
        color: colors[Math.floor(Math.random() * colors.length)],
        depth: rand(0.3, 1)
      };
    }

    var LEAF_COUNT = 13;
    var leaves = [];
    for (var i = 0; i < LEAF_COUNT; i++) leaves.push(makeLeaf());

    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w, h;

    function resize() {
      var rect = canvas.parentElement.getBoundingClientRect();
      w = rect.width;
      h = rect.height;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    function drawLeaf(leaf, t) {
      var narrow = w < 640;
      var span = 1.5;
      var y = (((leaf.baseY + t * leaf.vy) % span) + span) % span - 0.2;
      var x = leaf.baseX + Math.sin(t * leaf.driftFreq + leaf.driftPhase) * leaf.driftAmp;
      var rot = leaf.spin0 + t * leaf.spinSpeed;
      var size = leaf.size * (narrow ? 0.7 : 1);
      var fold = size * 0.26;

      ctx.save();
      ctx.translate(x * w, y * h);
      ctx.rotate(rot);
      ctx.globalAlpha = (narrow ? 0.6 : 1) * (0.16 + leaf.depth * 0.48);

      ctx.beginPath();
      ctx.moveTo(-size / 2, -size * 0.62);
      ctx.lineTo(size / 2 - fold, -size * 0.62);
      ctx.lineTo(size / 2, -size * 0.62 + fold);
      ctx.lineTo(size / 2, size * 0.62);
      ctx.lineTo(-size / 2, size * 0.62);
      ctx.closePath();
      ctx.fillStyle = "rgba(23, 29, 34, 0.4)";
      ctx.fill();
      ctx.strokeStyle = leaf.color;
      ctx.lineWidth = 1.1;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(size / 2 - fold, -size * 0.62);
      ctx.lineTo(size / 2 - fold, -size * 0.62 + fold);
      ctx.lineTo(size / 2, -size * 0.62 + fold);
      ctx.stroke();

      ctx.fillStyle = leaf.color;
      ctx.font = "600 " + Math.round(size * 0.3) + "px 'SFMono-Regular', Menlo, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(leaf.symbol, 0, size * 0.05);

      ctx.restore();
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      leaves.forEach(function (leaf) { drawLeaf(leaf, t); });
      ctx.globalAlpha = 1;
    }

    if (reduceMotion) {
      draw(9000);
    } else {
      requestAnimationFrame(function loop(t) {
        draw(t);
        requestAnimationFrame(loop);
      });
    }
  });
</script>
