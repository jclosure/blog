<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 940" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Building Conway's circle in four steps</title>
  <desc id="dsc">Four panels. One: the triangle, with the side opposite corner A marked. Two: a compass arc of that length swung from A crosses the two sides produced past A, fixing two points. Three: the same at B and C gives six points in all. Four: a single circle passes through all six.</desc>
