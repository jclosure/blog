  <title id="ttl">Conway's circle: the construction</title>
  <desc id="dsc">Triangle A B C with each side produced past both of its endpoints by the length of the opposite side. The six endpoints lie on one circle centred at the incentre I; the incircle sits inside it, concentric.</desc>
