<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">The right triangle hiding in every triangle</title>
  <desc id="dsc">A schematic right triangle. One leg is r, the incentre's perpendicular distance to a side line. The other leg is s, the semiperimeter, the distance along that line from the contact point out to an extension point. The hypotenuse, from the incentre to the extension point, has length R equal to the square root of r squared plus s squared. Not drawn to scale.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f2f5f3; }
    .mut { fill: #c9d3d8; }
    .lab { font-size: 23px; font-weight: 700; }
    .sml { font-size: 17px; }
    .tny { font-size: 13px; }
    .ital { font-style: italic; }
  </style>
  <rect width="940" height="470" fill="#101418"/>
<line x1="40.00" y1="300.00" x2="900.00" y2="300.00" stroke="#3a4650" stroke-width="1.6" stroke-linecap="round"/>
<line x1="250.00" y1="300.00" x2="830.00" y2="300.00" stroke="#64c7d8" stroke-width="4" stroke-linecap="round"/>
<line x1="250.00" y1="300.00" x2="95.00" y2="300.00" stroke="#64c7d8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/>
<line x1="250.00" y1="300.00" x2="250.00" y2="105.00" stroke="#5fd38d" stroke-width="4" stroke-linecap="round"/>
<line x1="250.00" y1="105.00" x2="830.00" y2="300.00" stroke="#f2b84b" stroke-width="4" stroke-linecap="round"/>
<line x1="250.00" y1="105.00" x2="95.00" y2="300.00" stroke="#f2b84b" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/>
<path d="M 268.00 300.00 L 268.00 282.00 L 250.00 282.00" fill="none" stroke="#f2f5f3" stroke-width="2"/>
<circle cx="830.00" cy="300.00" r="7" fill="#f2b84b" stroke="#101418" stroke-width="2"/>
<circle cx="95.00" cy="300.00" r="7" fill="#f2b84b" stroke="#101418" stroke-width="2"/>
<circle cx="250.00" cy="300.00" r="7" fill="#5fd38d" stroke="#101418" stroke-width="2"/>
<circle cx="250.00" cy="105.00" r="7" fill="#64c7d8" stroke="#101418" stroke-width="2"/>
<text x="234.00" y="105.00" class="lab" text-anchor="end" fill="#64c7d8">I  (incentre)</text>
<text x="254.00" y="330.00" class="sml mut" text-anchor="start">F  (contact point)</text>
<text x="830.00" y="330.00" class="sml mut" text-anchor="middle">extension point</text>
<text x="95.00" y="330.00" class="sml mut" text-anchor="middle">extension point</text>
<text x="540.00" y="284.00" class="lab ital" text-anchor="middle" fill="#64c7d8">s</text>
<text x="234.00" y="208.50" class="lab ital" text-anchor="end" fill="#5fd38d">r</text>
<text x="546.37" y="183.54" class="lab" text-anchor="middle" fill="#f2b84b">R = √(r² + s²)</text>
<text x="470.00" y="418.00" class="sml mut" text-anchor="middle">shape schematic — in a real triangle r is far shorter than s</text>
<text x="470.00" y="444.00" class="sml mut" text-anchor="middle">master triangle here:  r ≈ 1.87,  s ≈ 9.85,  R ≈ 10.02</text>
</svg>
