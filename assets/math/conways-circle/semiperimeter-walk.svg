<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Walk once around: every tangent length is used twice</title>
  <desc id="dsc">An animation. A marker travels once around the triangle. As it crosses each of the six boundary pieces, a coloured bar of that length drops into a tally below. After a full loop the tally shows two greens, two blues and two ambers; regrouped, it is x plus y plus z, then x plus y plus z again — so the semiperimeter is x plus y plus z.</desc>
