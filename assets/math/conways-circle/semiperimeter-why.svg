<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Why the semiperimeter is half: it is one of each tangent length</title>
  <desc id="dsc">The incircle touches the three sides at three points, cutting the triangle's boundary into six pieces. The two pieces meeting at each corner are equal: call them x at corner A, y at corner B, z at corner C. Going once around uses each length twice, so the perimeter is 2x plus 2y plus 2z, and half of it, the semiperimeter s, is x plus y plus z.</desc>
