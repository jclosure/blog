<path d="M 150.0 372.0 L 150.0 364.0 L 450.0 364.0 L 450.0 372.0" fill="none" stroke="#f2f5f3" stroke-width="2"/>
<text x="300.00" y="358.00" class="sml" text-anchor="middle" fill="#f2f5f3">x + y + z  =  s</text>
<path d="M 450.0 372.0 L 450.0 364.0 L 750.0 364.0 L 750.0 372.0" fill="none" stroke="#f2f5f3" stroke-width="2"/>
<text x="600.00" y="358.00" class="sml" text-anchor="middle" fill="#f2f5f3">x + y + z  =  s</text>
<text x="450.00" y="444.00" class="sml" text-anchor="middle" fill="#f2f5f3">once around the triangle  =  x + x + y + y + z + z  =  2s</text>
<text x="450.00" y="508.00" class="sml mut" text-anchor="middle">each of x, y, z is shared by two sides, so the perimeter counts it twice —</text>
<text x="450.00" y="530.00" class="sml mut" text-anchor="middle">the semiperimeter s is exactly one of each: s = x + y + z</text>
