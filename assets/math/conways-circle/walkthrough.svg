<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 906" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">A walk-through: build the circle one corner at a time</title>
  <desc id="dsc">An animation. From corner A, an arc the length of the opposite side is swung out; where it crosses the two sides extended past A, two points appear. The same happens at B and at C. Finally a circle is drawn through all six points.</desc>
