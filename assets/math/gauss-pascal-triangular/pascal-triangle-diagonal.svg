<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">Triangular numbers in Pascal's triangle</title>
  <desc id="desc">Pascal's triangle with counting numbers in light blue and triangular numbers in green. The triangular diagonal is 1, 3, 6, 10, 15.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f2f5f3; }
    .muted { fill: #aab7bd; }
    .node { fill: #1b2329; stroke: #35424b; stroke-width: 2; }
    .hot { fill: #5fd38d; stroke: #d5ffe3; stroke-width: 3; }
    .count { fill: #64c7d8; stroke: #d8f8ff; stroke-width: 2.5; }
    .count-text { fill: #64c7d8; }
    .tri-text { fill: #5fd38d; }
    .formula { font-size: 26px; font-weight: 700; }
    .label { font-size: 20px; }
    .small { font-size: 17px; }
    .num { font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <rect width="920" height="620" fill="#101418"/>
  <text x="48" y="54" class="formula">The same triangle appears in Pascal's triangle</text>
  <text x="48" y="84" class="muted small">The counting numbers accumulate into the triangular numbers.</text>

  <g transform="translate(48 124)">
    <text x="0" y="0" class="small">Key:</text>
    <circle cx="12" cy="32" r="11" class="count"/><text x="34" y="38" class="small">Counting numbers</text>
    <circle cx="12" cy="66" r="11" class="hot"/><text x="34" y="72" class="small">Triangular numbers</text>
  </g>

  <!-- Pascal triangle nodes. Row spacing 66, col spacing 70. -->
  <g transform="translate(130 145)">
    <!-- row 0 -->
    <circle cx="210" cy="0" r="27" class="node"/><text x="210" y="0" class="num">1</text>

    <!-- row 1 -->
    <circle cx="175" cy="66" r="27" class="node"/><text x="175" y="66" class="num">1</text>
    <circle cx="245" cy="66" r="27" class="node"/><text x="245" y="66" class="num">1</text>

    <!-- row 2 -->
    <circle cx="140" cy="132" r="27" class="node"/><text x="140" y="132" class="num">1</text>
    <circle cx="210" cy="132" r="27" class="count"/><text x="210" y="132" class="num">2</text>
    <circle cx="280" cy="132" r="27" class="node"/><text x="280" y="132" class="num">1</text>

    <!-- row 3 -->
    <circle cx="105" cy="198" r="27" class="node"/><text x="105" y="198" class="num">1</text>
    <circle cx="175" cy="198" r="27" class="count"/><text x="175" y="198" class="num">3</text>
    <circle cx="245" cy="198" r="27" class="hot"/><text x="245" y="198" class="num">3</text>
    <circle cx="315" cy="198" r="27" class="node"/><text x="315" y="198" class="num">1</text>

    <!-- row 4 -->
    <circle cx="70" cy="264" r="27" class="node"/><text x="70" y="264" class="num">1</text>
    <circle cx="140" cy="264" r="27" class="count"/><text x="140" y="264" class="num">4</text>
    <circle cx="210" cy="264" r="27" class="hot"/><text x="210" y="264" class="num">6</text>
    <circle cx="280" cy="264" r="27" class="node"/><text x="280" y="264" class="num">4</text>
    <circle cx="350" cy="264" r="27" class="node"/><text x="350" y="264" class="num">1</text>

    <!-- row 5 -->
    <circle cx="35" cy="330" r="27" class="node"/><text x="35" y="330" class="num">1</text>
    <circle cx="105" cy="330" r="27" class="count"/><text x="105" y="330" class="num">5</text>
    <circle cx="175" cy="330" r="27" class="hot"/><text x="175" y="330" class="num">10</text>
    <circle cx="245" cy="330" r="27" class="node"/><text x="245" y="330" class="num">10</text>
    <circle cx="315" cy="330" r="27" class="node"/><text x="315" y="330" class="num">5</text>
    <circle cx="385" cy="330" r="27" class="node"/><text x="385" y="330" class="num">1</text>

    <!-- row 6 -->
    <circle cx="0" cy="396" r="27" class="node"/><text x="0" y="396" class="num">1</text>
    <circle cx="70" cy="396" r="27" class="count"/><text x="70" y="396" class="num">6</text>
    <circle cx="140" cy="396" r="27" class="hot"/><text x="140" y="396" class="num">15</text>
    <circle cx="210" cy="396" r="27" class="node"/><text x="210" y="396" class="num">20</text>
    <circle cx="280" cy="396" r="27" class="node"/><text x="280" y="396" class="num">15</text>
    <circle cx="350" cy="396" r="27" class="node"/><text x="350" y="396" class="num">6</text>
    <circle cx="420" cy="396" r="27" class="node"/><text x="420" y="396" class="num">1</text>

  </g>

  <g transform="translate(620 160)">
    <text x="0" y="0" class="label">Highlighted diagonal:</text>
    <text x="0" y="42" class="formula tri-text">1, 3, 6, 10, 15, ...</text>
    <text x="0" y="88" class="small muted">These are the triangular numbers.</text>
    <text x="0" y="140" class="small">They are running totals:</text>
    <text x="0" y="178" class="small tri-text">1</text>
    <text x="0" y="210" class="small"><tspan class="count-text">1 + 2</tspan><tspan> = </tspan><tspan class="tri-text">3</tspan></text>
    <text x="0" y="242" class="small"><tspan class="count-text">1 + 2 + 3</tspan><tspan> = </tspan><tspan class="tri-text">6</tspan></text>
    <text x="0" y="274" class="small"><tspan class="count-text">1 + 2 + 3 + 4</tspan><tspan> = </tspan><tspan class="tri-text">10</tspan></text>
  </g>
</svg>
