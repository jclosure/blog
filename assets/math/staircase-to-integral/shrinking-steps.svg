    .muted { fill: #aab7bd; }
    .label { font-size: 17px; font-weight: 700; }
    .small { font-size: 15px; font-weight: 700; }
    .bar { fill: none; stroke: #5fd38d; stroke-width: 2; }
    .under { fill: rgba(100, 199, 216, 0.34); }
    .sliver { fill: #f2b84b; opacity: 0.95; }
    .diag { stroke: #64c7d8; stroke-width: 3; stroke-linecap: round; }
  </style>
