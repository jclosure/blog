<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 278" role="img" aria-labelledby="title desc">
  <title id="title">Three staircases over the same diagonal line with shrinking step size</title>
  <desc id="desc">Three panels show the diagonal line from zero to four with staircases of step size one, one half, and one quarter. As the step shrinks, the amber leftover area shrinks in proportion, from two, to one, to one half, hugging the line more closely each time.</desc>
