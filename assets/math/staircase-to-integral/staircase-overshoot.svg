<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="title desc">
  <title id="title">A staircase of five bars compared against the diagonal line y equals x</title>
  <desc id="desc">Five flat-topped bars of height 1 through 5 sit above the diagonal line from the origin to the point five, five. Two labels sit in the left margin: the teal region under the line, area n squared over 2, and the amber leftover, n over 2, whose leader line points to the exact midpoint of the diagonal.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f2f5f3; }
    .muted { fill: #d3dbdf; }
    .label { font-size: 21px; font-weight: 700; }
    .small { font-size: 17px; }
    .bar { fill: none; stroke: #5fd38d; stroke-width: 2; }
    .under { fill: rgba(100, 199, 216, 0.34); }
    .sliver { fill: #f2b84b; opacity: 0.95; }
    .diag { stroke: #64c7d8; stroke-width: 3.5; stroke-linecap: round; }
    .leader-teal { stroke: #64c7d8; stroke-width: 1.6; }
    .leader-amber { stroke: #f2b84b; stroke-width: 1.6; }
    .dot-teal { fill: #64c7d8; }
    .dot-amber { fill: #f2b84b; }
  </style>

  <rect width="700" height="460" fill="#101418"/>
  <path class="under" d="M 230 380 L 500 110 L 500 380 Z"/>
  <path class="sliver" d="M 230.0 380.0 L 230.0 326.0 L 284.0 326.0 Z"/>
  <path class="sliver" d="M 284.0 326.0 L 284.0 272.0 L 338.0 272.0 Z"/>
  <path class="sliver" d="M 338.0 272.0 L 338.0 218.0 L 392.0 218.0 Z"/>
  <path class="sliver" d="M 392.0 218.0 L 392.0 164.0 L 446.0 164.0 Z"/>
  <path class="sliver" d="M 446.0 164.0 L 446.0 110.0 L 500.0 110.0 Z"/>
  <rect x="230.0" y="326.0" width="54.0" height="54.0" class="bar"/>
  <rect x="284.0" y="272.0" width="54.0" height="108.0" class="bar"/>
  <rect x="338.0" y="218.0" width="54.0" height="162.0" class="bar"/>
  <rect x="392.0" y="164.0" width="54.0" height="216.0" class="bar"/>
  <rect x="446.0" y="110.0" width="54.0" height="270.0" class="bar"/>
  <line x1="230.0" y1="380.0" x2="500.0" y2="110.0" class="diag"/>
  <line x1="230.0" y1="380.0" x2="500.0" y2="380.0" stroke="#3a4650" stroke-width="1.5"/>
  <line x1="230.0" y1="380.0" x2="230.0" y2="110.0" stroke="#3a4650" stroke-width="1.5"/>
  <text x="230.0" y="406.0" class="small muted" text-anchor="middle">0</text>
  <text x="284.0" y="406.0" class="small muted" text-anchor="middle">1</text>
  <text x="338.0" y="406.0" class="small muted" text-anchor="middle">2</text>
  <text x="392.0" y="406.0" class="small muted" text-anchor="middle">3</text>
  <text x="446.0" y="406.0" class="small muted" text-anchor="middle">4</text>
  <text x="500.0" y="406.0" class="small muted" text-anchor="middle">5</text>
  <circle cx="365.0" cy="245.0" r="4" class="dot-amber"/>
  <line x1="150.0" y1="182.0" x2="365.0" y2="245.0" class="leader-amber"/>
  <text x="24.0" y="140" class="label" fill="#f2b84b">n/2 leftover</text>
  <text x="24.0" y="166" class="small muted">five slivers,</text>
  <text x="24.0" y="188" class="small muted">1/2 each</text>
  <circle cx="259.7" cy="370.3" r="4" class="dot-teal"/>
  <line x1="174.0" y1="355.0" x2="259.7" y2="370.3" class="leader-teal"/>
  <text x="24" y="335" class="label" fill="#8ee6c1">n&#178;/2</text>
  <text x="24" y="361" class="small muted">area under the line</text>
</svg>
