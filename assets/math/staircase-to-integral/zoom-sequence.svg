<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 942 268" role="img" aria-labelledby="title desc">
  <title id="title">Zooming into one unit of the diagonal line with finer and finer steps</title>
  <desc id="desc">Four panels show the same unit square containing the diagonal line, refined with step sizes one, one quarter, one sixteenth, and one sixty fourth. The staircase never stops being made of flat steps and corners, but the amber leftover area thins from one half toward zero, hugging the line more and more closely.</desc>
